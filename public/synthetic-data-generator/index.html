    <title>Synthetic Data Agent — Studio</title>
    <script>
      (function() {
        function applyTheme(t) {
          var theme = t || localStorage.getItem("prointerview_theme") || localStorage.getItem("globalTheme") || "light";
          document.documentElement.classList.remove("theme-dark", "theme-light", "theme-eyeprotect");
          if (theme === "eyeprotect") {
            document.documentElement.classList.add("theme-light", "theme-eyeprotect");
          } else {
            document.documentElement.classList.add("theme-" + theme);
          }
        }
        applyTheme();
        window.addEventListener("message", function(e) {
          if (e.data && e.data.type === "sync-theme" && e.data.theme) {
            applyTheme(e.data.theme);
          }
        });
        window.addEventListener("storage", function(e) {
          if (e.key === "prointerview_theme" || e.key === "globalTheme") {
            applyTheme();
          }
        });
      })();
    </script>
