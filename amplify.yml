version: 1
backend:
  phases:
    build:
      commands:
        - npm install
        - npx cdk bootstrap aws://984174955449/ap-south-1
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm install
        # Create .env.production to inject variables into Next.js build environment
        - echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> .env.production
        - echo "SARVAM_API_KEY=${SARVAM_API_KEY}" >> .env.production
        - echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}" >> .env.production
        - echo "NEXT_PUBLIC_MERCHANT_UPI_ID=${NEXT_PUBLIC_MERCHANT_UPI_ID}" >> .env.production
        - echo "TAVUS_API_KEY=${TAVUS_API_KEY}" >> .env.production
        - echo "TAVUS_PAL_ID=${TAVUS_PAL_ID}" >> .env.production
        - echo "TAVUS_FACE_ID=${TAVUS_FACE_ID}" >> .env.production
        - echo "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" >> .env.production
        - echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" >> .env.production
        - echo "MONGODB_URI=${MONGODB_URI}" >> .env.production
        - echo "GMAIL_USER=${GMAIL_USER}" >> .env.production
        - echo "GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}" >> .env.production
        - echo "RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}" >> .env.production
        - echo "RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}" >> .env.production
        - echo "NEXT_PUBLIC_RAZORPAY_KEY_ID=${NEXT_PUBLIC_RAZORPAY_KEY_ID}" >> .env.production
        - echo "HAPPENSTANCE_API_KEY=${HAPPENSTANCE_API_KEY}" >> .env.production
        - echo "ADZUNA_APP_ID=${ADZUNA_APP_ID}" >> .env.production
        - echo "ADZUNA_APP_KEY=${ADZUNA_APP_KEY}" >> .env.production
        - echo "ADZUNA_COUNTRY=${ADZUNA_COUNTRY}" >> .env.production
        - echo "JWT_SECRET=${JWT_SECRET}" >> .env.production
        - echo "EMAIL_USER=${EMAIL_USER}" >> .env.production
        - echo "EMAIL_PASS=${EMAIL_PASS}" >> .env.production
        - echo "RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}" >> .env.production
        - echo "CRON_SECRET=${CRON_SECRET}" >> .env.production
        - echo "S3_BUCKET=${S3_BUCKET}" >> .env.production
        - echo "AWS_S3_BUCKET=${AWS_S3_BUCKET}" >> .env.production
        - echo "S3_REGION=${S3_REGION}" >> .env.production
        - echo "S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}" >> .env.production
        - echo "S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}" >> .env.production
        - echo "S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL}" >> .env.production
        - echo "AWS_REGION=${AWS_REGION}" >> .env.production
        - echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}" >> .env.production
        - echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}" >> .env.production
        - echo "INIT_DB_KEY=${INIT_DB_KEY}" >> .env.production
        - echo "SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}" >> .env.production
        - echo "SEED_EMPLOYEE_PASSWORD=${SEED_EMPLOYEE_PASSWORD}" >> .env.production
        - echo "SEED_ADMIN_IDENTIFIER=${SEED_ADMIN_IDENTIFIER}" >> .env.production
        - echo "SEED_EMPLOYEE_IDENTIFIER=${SEED_EMPLOYEE_IDENTIFIER}" >> .env.production
        - echo "TAVUS_REPLICA_ID=${TAVUS_REPLICA_ID}" >> .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - .next/cache/**/*
      - node_modules/**/*
